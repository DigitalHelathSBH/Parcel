<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SSB Reports{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>const APP_ROOT = "{{ request.script_root }}";</script>
<script src="{{ url_for('static', filename='searchable-select.js') }}"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['"TH Sarabun New"', '"Segoe UI"', 'Tahoma', 'sans-serif'] },
        colors: {
          brand: { 50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8' }
        }
      }
    }
  }
</script>
<style>
  /* TH Sarabun New อ่านเล็กกว่าฟอนต์ละตินที่ขนาดพิกเซลเท่ากัน จึงขยาย root ขึ้นเพื่อให้ตัวอักษรทั้งหน้า (ที่ใช้ class ของ Tailwind แบบ rem) ใหญ่ขึ้นตามสัดส่วน */
  html { font-size: 20px; }
  .nav-link { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:#3f3f46; font-weight:500; font-size:1.05rem; }
  .nav-link:hover { background:#f4f4f5; }
  .nav-link.active { background:#eff6ff; color:#1d4ed8; }
  .nav-icon { width:22px; height:22px; flex-shrink:0; }
  .ss-button { width:100%; text-align:left; border:1px solid #d4d4d8; border-radius:0.375rem; padding:0.5rem 0.75rem; background:#fff; display:flex; justify-content:space-between; align-items:center; }
  .ss-button:focus { outline:none; box-shadow:0 0 0 2px rgba(59,130,246,.5); border-color:#3b82f6; }
  .ss-panel { position:absolute; z-index:20; margin-top:4px; width:100%; background:#fff; border:1px solid #e4e4e7; border-radius:0.375rem; box-shadow:0 10px 15px -3px rgba(0,0,0,.1); max-height:16rem; overflow:auto; }
  .ss-search { width:100%; border:1px solid #e4e4e7; border-radius:0.25rem; padding:0.375rem 0.5rem; font-size:1rem; }
</style>
</head>
<body class="bg-zinc-50 text-zinc-800 font-sans antialiased">
<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-64 shrink-0 border-r border-zinc-200 bg-white flex flex-col">
    <div class="h-16 flex items-center gap-2 px-5 border-b border-zinc-200">
      <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold">S</div>
      <div>
        <div class="font-bold text-lg text-zinc-900 leading-tight">SSB Reports</div>
        <div class="text-sm text-zinc-400 leading-tight">ระบบรายงานภายใน</div>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-6">
      <div>
        <div class="px-3 mb-1.5 text-sm font-semibold uppercase tracking-wide text-zinc-400">ครุภัณฑ์</div>
        <a href="{{ url_for('index') }}" class="nav-link {{ 'active' if request.path == '/' else '' }}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          ตรวจครุภัณฑ์ประจำปี
        </a>
        <a href="{{ url_for('low_value_page') }}" class="nav-link {{ 'active' if request.path == '/low_value' else '' }}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/></svg>
          ต่ำกว่าเกณฑ์ (&lt;10,000 บ.)
        </a>
      </div>

      <div>
        <div class="px-3 mb-1.5 text-sm font-semibold uppercase tracking-wide text-zinc-400">ค่าเสื่อมราคา</div>
        <a href="{{ url_for('depreciation_page') }}" class="nav-link {{ 'active' if request.path == '/depreciation' else '' }}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
          รายละเอียด / สรุป
        </a>
      </div>

      <div>
        <div class="px-3 mb-1.5 text-sm font-semibold uppercase tracking-wide text-zinc-400">จัดซื้อจัดจ้าง</div>
        <a href="{{ url_for('purchases_page') }}" class="nav-link {{ 'active' if request.path == '/purchases' else '' }}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
          รายงานซื้อประจำเดือน
        </a>
      </div>
    </nav>

    <div class="px-4 py-3 border-t border-zinc-200 text-sm text-zinc-400">
      เชื่อมต่อ SSBDatabase (localhost)
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 border-b border-zinc-200 bg-white flex items-center px-6">
      <h1 class="text-xl font-semibold text-zinc-900">{% block page_title %}{% endblock %}</h1>
    </header>
    <main class="flex-1 p-6">
      {% block content %}{% endblock %}
    </main>
  </div>

</div>
</body>
</html>
